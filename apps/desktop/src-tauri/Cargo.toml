[package]
name = "acta-desktop"
description = "WP6: app Tauri v2 — cableado de comandos/eventos, ventanas (principal + pastilla NSPanel), detección → pregunta."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "acta_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
acta-core = { workspace = true }
acta-audio = { workspace = true }
acta-store = { workspace = true }
acta-llm = { workspace = true }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }

# Solo macOS: adaptadores nativos. Windows (después) añadirá su crate aquí.
[target.'cfg(target_os = "macos")'.dependencies]
acta-mac-bridge = { workspace = true }

# Lints propios (no workspace): las macros de Tauri generan código con unsafe.
[lints.clippy]
zombie_processes = "deny"
let_underscore_future = "deny"
