<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- acta: la voz (onda) se convierte en acta (hoja). Marca original, rejilla de iconos de macOS (824 px sobre 1024). -->
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#9a8cff"/>
      <stop offset="0.5" stop-color="#5b5ff0"/>
      <stop offset="1" stop-color="#3136c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceeff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6cff"/>
      <stop offset="1" stop-color="#3b40d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a1c5c" flood-opacity="0.32"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#14165a" flood-opacity="0.38"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  </g>
  <g filter="url(#lift)">
    <!-- hoja con la esquina doblada -->
    <path d="M364 250h214l142 142v326a56 56 0 0 1-56 56H364a56 56 0 0 1-56-56V306a56 56 0 0 1 56-56z" fill="url(#sheet)"/>
    <path d="M578 250l142 142H624a46 46 0 0 1-46-46z" fill="#c9cdff"/>
  </g>
  <!-- onda de voz -->
  <g fill="url(#wave)">
    <rect x="372" y="492" width="40" height="76" rx="20"/>
    <rect x="432" y="446" width="40" height="168" rx="20"/>
    <rect x="492" y="404" width="40" height="252" rx="20"/>
    <rect x="552" y="462" width="40" height="136" rx="20"/>
    <rect x="612" y="500" width="40" height="60" rx="20"/>
  </g>
  <!-- una línea de texto: lo que queda escrito -->
  <rect x="372" y="700" width="188" height="26" rx="13" fill="#b9bdf7"/>
</svg>
