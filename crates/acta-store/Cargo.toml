[package]
name = "acta-store"
description = "WP2: SQLite (rusqlite) + FTS5 + sqlite-vec, repositorios, búsqueda híbrida, embeddings locales y clustering de grupos."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Embeddings locales con fastembed-rs (descarga onnxruntime al compilar).
local-embeddings = ["dep:fastembed"]

[dependencies]
acta-core = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
fastembed = { workspace = true, optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[lints]
workspace = true
